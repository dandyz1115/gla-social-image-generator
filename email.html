<p id="copy-status" role="status"></p>
<script>
  const status = document.querySelector('#copy-status');
  let statusTimer;
  document.querySelector('main').addEventListener('click', async (event) => {
    const button = event.target.closest('button[data-copy]');
    if (!button) return;

    const variant = button.closest('.variant');
    const url = variant.querySelector('a').href;
    const {width, height, alt} = variant.dataset;
    const isHtml = button.dataset.copy === 'html';
    const text = isHtml
      ? `<img src="${url}" width="${width}" height="${height}" alt="${alt}" style="display:block;width:100%;max-width:${width}px;height:auto;border:0;">`
      : url;
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = isHtml ? '已复制 HTML' : '已复制直链';
    } catch {
      window.prompt('请手动复制', text);
      return;
    }
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { status.textContent = ''; }, 2200);
  });
</script>
