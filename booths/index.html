<body>
  <header class="masthead">
    <div class="masthead-inner">
      <img src="../assets/gla-blue.svg" width="104" height="37" alt="GLA Global Logistics Alliance">
      <nav class="tool-nav" aria-label="业务工具">

        <a href="../business-pdfs/">业务 PDF 资料</a>
      </nav>
    </div>
  </header>
  <main class="booth-library">
    <header class="intro">
      <h1>展位效果图</h1>
      <p>按公司、归属人、尺寸和展位类型查找，下载高清原图。</p>
    </header>
    <section class="booth-kit" aria-labelledby="booth-kit-title">
      <div>
        <h2 id="booth-kit-title">展位效果图自助包</h2>
        <p>24 款参考图、豆包提示词和 Skill。</p>
      </div>
      <a class="download booth-kit-download" href="./downloads/gla-booth-self-service-20261124-v1.zip" download="GLA展位效果图自助包-20261124-V1.zip">下载自助包（ZIP）</a>
      <ol class="booth-kit-steps" aria-label="使用方法">
        <li><strong>下载并解压</strong>，打开「打开选款和提示词.html」。</li>
        <li><strong>选款、填公司名</strong>，保存对应的结构图并复制提示词。</li>
        <li><strong>去豆包出图</strong>，先传客户 Logo，再传结构图，然后粘贴提示词。</li>
      </ol>
    </section>
    <section class="filters" aria-label="搜索与筛选">
      <label>搜索<input id="search" type="search" placeholder="例如 TSL、Rita、6×3" autocomplete="off"></label>
      <label>归属人<select id="owner"><option value="">全部</option></select></label>
      <label>尺寸<select id="size"><option value="">全部</option></select></label>
      <label>类型<select id="type"><option value="">全部</option></select></label>
      <button class="quiet" id="clear" type="button">清除筛选</button>
    </section>
    <p id="status" role="status" class="result-status" tabindex="-1">正在加载效果图…</p>
    <div id="cards" class="booth-grid"></div>
    <nav id="pagination" class="pagination" aria-label="展位效果图分页" hidden></nav>
    <noscript>请启用 JavaScript 使用图库的搜索和下载功能。</noscript>
  </main>
  <dialog id="preview" aria-labelledby="preview-title">
    <div class="preview-bar">
      <h2 id="preview-title"></h2>
      <button type="button" class="quiet" id="close-preview">关闭预览</button>
    </div>
    <img id="preview-image" alt="">
    <div class="preview-bar">
      <span id="preview-meta"></span>
      <a id="preview-download" class="download" download>下载原图</a>
    </div>
  </dialog>
