<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../booths/gallery.css?v=5">
  <script src="../booths/gallery.js?v=5" defer></script>
  <link rel="stylesheet" href="./availability.css?v=1">

<body>
  <header class="masthead">
    <div class="masthead-inner">
      <img src="../assets/gla-blue.svg" width="104" height="37" alt="GLA Global Logistics Alliance">
      <nav class="tool-nav" aria-label="业务工具">
        <a href="../">社媒图生成</a>
        <a href="../email.html">邮件素材</a>
        <a href="../booths/">展位效果图</a>
        <a href="./" aria-current="page">赞助产品效果图</a>
        <a href="../business-pdfs/">业务 PDF 资料</a>
      </nav>
    </div>
  </header>
  <main class="booth-library">
    <header class="intro">
      <h1>赞助产品效果图</h1>
      <p>按产品、品牌或归属人查找，预览并下载原图。</p>
      <p><a href="./originals/34996e5d758ade851c6c.png" target="_blank" rel="noopener">查看最新万能转换头赞助海报</a> · <a href="./originals/34996e5d758ade851c6c.png" download="GLA深圳2027-万能转换头赞助-中文海报.png">下载高清PNG</a></p>
    </header>
    <section class="availability" aria-labelledby="availability-title">
      <div class="availability-heading"><div><h2 id="availability-title">深圳2027 · 可售赞助资源</h2><p>针对客户需求，选取1—2项赞助，联系项目组定制销售方案。</p></div><span>清单更新：2026-11-27</span></div>
      <div class="availability-controls" role="group" aria-label="赞助清单筛选">
        <button type="button" class="active" data-availability="recommended" aria-pressed="true">首推赞助</button>
        <button type="button" data-availability="all" aria-pressed="false">全部待售</button>
        <label>搜索赞助<input id="availability-search" type="search" placeholder="例如演讲、行李吊牌" autocomplete="off"></label>
      </div>
      <p id="availability-status" role="status">正在加载赞助清单…</p>
      <div id="availability-list"></div>
      <p class="availability-note">名额以项目组实时确认为准；价格、权益及独家合作条件请单独洽谈。</p>
    </section>
    <h2 class="renderings-heading">产品效果图图库</h2>
    <section class="filters sponsor-filters" aria-label="搜索与筛选">
      <label>搜索<input id="search" type="search" placeholder="例如行李牌、相册、吊旗" autocomplete="off"></label>
      <label>归属人<select id="owner"><option value="">全部</option></select></label>
      <label>产品<select id="type"><option value="">全部</option></select></label>
      <button class="quiet" id="clear" type="button">清除筛选</button>
    </section>
    <p id="status" role="status" class="result-status" tabindex="-1">正在加载效果图…</p>
    <div id="cards" class="booth-grid"></div>
    <nav id="pagination" class="pagination" aria-label="赞助产品效果图分页" hidden></nav>
    <noscript>请启用 JavaScript 使用图库的搜索和下载功能。</noscript>
  </main>
  <dialog id="preview" aria-labelledby="preview-title">
    <div class="preview-bar">
      <h2 id="preview-title"></h2>
      <button type="button" class="quiet" id="close-preview">关闭预览</button>
    </div>
    <img id="preview-image" alt="">
    <div class="preview-bar">
      <span id="preview-meta"></span>
      <a id="preview-download" class="download" download>下载原图</a>
    </div>
  </dialog>
</body>
</html>
